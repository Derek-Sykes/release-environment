services:
  runner:
    platform: linux/amd64
    build: ./runner
    image: release-environment-runner:${RELEASE_INSTANCE}
    mem_limit: 1g
    cpus: 1
    environment:
      RELEASE_WORK_ROOT: ${RELEASE_WORK_ROOT:-/opt/runner/_work}
      RELEASE_REQUEST: ${RELEASE_REQUEST}
    volumes:
      - ${RELEASE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - work:${RELEASE_WORK_ROOT:-/opt/runner/_work}
    labels:
      release-environment.instance: ${RELEASE_INSTANCE}
      release-environment.request: ${RELEASE_REQUEST}
volumes:
  work:
    external: true
    name: release-environment-work-${RELEASE_REQUEST}
